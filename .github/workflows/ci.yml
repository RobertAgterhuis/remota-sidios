name: ci

on:
  push:
    branches: [main, sidios, "feat/**", "fix/**", "deps/**", "build/**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remota-server
      - run: cargo fmt --check
        working-directory: remota-server
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: remota-server
      - run: cargo test
        working-directory: remota-server
