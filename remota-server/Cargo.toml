[package]
name = "remota-server"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["std"] }
md-5 = "0.10"
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-cert = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
roxmltree = "0.20"
sha1 = "0.10"
zeroize = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
futures-util = "0.3"
if-addrs = "0.13"
ironrdp-acceptor = "0.10"
ironrdp-async = "0.10"
ironrdp-connector = "0.10"
ironrdp-core = "0.2"
ironrdp-pdu = "0.9"
ironrdp-rdcleanpath = "0.2"
ironrdp-tokio = "0.10"
ipnet = "2"
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
subtle = "2"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }

[dev-dependencies]
md4 = "0.10"
bytes = "1"
rand = "0.10"
tempfile = "3"
tokio-tungstenite = "0.28"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# ironrdp-connector 0.10.0 pins sspi 0.21 / picky 7.0.0-rc.25, whose ecdsa pre-release cannot coexist
# with russh's ecdsa 0.17. The vendored copies (MIT OR Apache-2.0) move connector and acceptor to
# sspi 0.23 / picky rc.26; the only code change is that `TsRequest::buffer_len` now returns a
# Result (see vendor/README.md). Drop them once an IronRDP release does the same.
[patch.crates-io]
ironrdp-acceptor = { path = "vendor/ironrdp-acceptor" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
